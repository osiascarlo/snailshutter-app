<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 660" width="100%" height="100%" style="background:#ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker pointing right -->
    <marker id="arrow-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <!-- Arrow marker pointing left -->
    <marker id="arrow-left" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1.5 L 1 5 L 10 8.5 z" fill="#0f172a"/>
    </marker>
    <!-- Arrow marker pointing down -->
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1.5 0 L 5 9 L 8.5 0 z" fill="#0f172a"/>
    </marker>
    <!-- Arrow marker pointing up -->
    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1.5 10 L 5 1 L 8.5 10 z" fill="#0f172a"/>
    </marker>

    <!-- Soft drop shadow for elements -->
    <filter id="soft-shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Solid White Sheet Background -->
  <rect width="1260" height="660" fill="#ffffff" />

  <!-- ============================================================== -->
  <!-- EXTERNAL ENTITIES (LEFT COLUMN)                                -->
  <!-- ============================================================== -->

  <!-- Entity 1: Registered User (Top Left) -->
  <g id="entity-registered-user">
    <rect x="75" y="80" width="190" height="56" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="170" y="113" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">
      Registered User
    </text>
  </g>

  <!-- Entity 2: Administrator (Bottom Left) -->
  <g id="entity-administrator">
    <rect x="75" y="462" width="190" height="56" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" filter="url(#soft-shadow)" />
    <text x="170" y="495" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">
      Administrator
    </text>
  </g>


  <!-- ============================================================== -->
  <!-- SUB-PROCESSES OF PROCESS 2.0 (CENTER COLUMN)                   -->
  <!-- ============================================================== -->

  <!-- Process 2.1: Create / Update Booking -->
  <g id="process-2-1">
    <circle cx="640" cy="110" r="52" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter="url(#soft-shadow)" />
    <line x1="592" y1="94" x2="688" y2="94" stroke="#0f172a" stroke-width="1" />
    <text x="640" y="87" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">2.1</text>
    <text x="640" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Create / Update</text>
    <text x="640" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Booking</text>
  </g>

  <!-- Process 2.2: Process Payment -->
  <g id="process-2-2">
    <circle cx="640" cy="300" r="52" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter="url(#soft-shadow)" />
    <line x1="592" y1="284" x2="688" y2="284" stroke="#0f172a" stroke-width="1" />
    <text x="640" y="277" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">2.2</text>
    <text x="640" y="311" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Process Payment</text>
  </g>

  <!-- Process 2.3: Update Booking Status -->
  <g id="process-2-3">
    <circle cx="640" cy="490" r="52" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter="url(#soft-shadow)" />
    <line x1="592" y1="474" x2="688" y2="474" stroke="#0f172a" stroke-width="1" />
    <text x="640" y="467" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">2.3</text>
    <text x="640" y="495" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Update Booking</text>
    <text x="640" y="511" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Status</text>
  </g>


  <!-- ============================================================== -->
  <!-- DATA STORES (RIGHT COLUMN)                                     -->
  <!-- ============================================================== -->

  <!-- Store 1: D2 tbl_bookings (at Process 2.1) -->
  <g id="ds-2a">
    <rect x="910" y="88" width="260" height="44" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" filter="url(#soft-shadow)" />
    <line x1="958" y1="88" x2="958" y2="132" stroke="#0f172a" stroke-width="1.8" />
    <text x="934" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">D2</text>
    <text x="976" y="115" font-size="12.5" font-weight="700" fill="#0f172a">tbl_bookings</text>
  </g>

  <!-- Store 2: D4 tbl_booking_payments (at Process 2.2) -->
  <g id="ds-4">
    <rect x="910" y="278" width="260" height="44" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" filter="url(#soft-shadow)" />
    <line x1="958" y1="278" x2="958" y2="322" stroke="#0f172a" stroke-width="1.8" />
    <text x="934" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">D4</text>
    <text x="976" y="305" font-size="12.5" font-weight="700" fill="#0f172a">tbl_booking_payments</text>
  </g>

  <!-- Store 3: D2 tbl_bookings (at Process 2.3) -->
  <g id="ds-2b">
    <rect x="910" y="468" width="260" height="44" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" filter="url(#soft-shadow)" />
    <line x1="958" y1="468" x2="958" y2="512" stroke="#0f172a" stroke-width="1.8" />
    <text x="934" y="495" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">D2</text>
    <text x="976" y="495" font-size="12.5" font-weight="700" fill="#0f172a">tbl_bookings</text>
  </g>


  <!-- ============================================================== -->
  <!-- DATA FLOW LINES & LABELS                                       -->
  <!-- ============================================================== -->

  <!-- =================== ROW 1: PROCESS 2.1 ======================== -->
  <!-- Registered User ==> Process 2.1 -->
  <line x1="265" y1="96" x2="586" y2="96" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-right)" />
  <text x="420" y="89" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Booking Details (Service, Package, Date, Time, etc.)</text>

  <!-- Process 2.1 ==> Registered User -->
  <line x1="587" y1="124" x2="267" y2="124" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-left)" />
  <text x="420" y="139" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Booking Confirmation / Status</text>

  <!-- Process 2.1 ==> D2 tbl_bookings -->
  <line x1="693" y1="96" x2="908" y2="96" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-right)" />
  <text x="800" y="89" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Booking Data</text>

  <!-- D2 tbl_bookings ==> Process 2.1 -->
  <line x1="909" y1="124" x2="695" y2="124" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-left)" />
  <text x="800" y="139" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Booking Records</text>


  <!-- ================= VERTICAL: 2.1 ===> 2.2 ====================== -->
  <line x1="640" y1="163" x2="640" y2="246" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-down)" />
  <text x="648" y="208" text-anchor="start" font-size="10" font-weight="600" fill="#0f172a">Booking ID</text>


  <!-- =================== ROW 2: PROCESS 2.2 ======================== -->
  <!-- Registered User drop-down trunk to Process 2.2 -->
  <line x1="180" y1="136" x2="180" y2="314" stroke="#0f172a" stroke-width="1.5" />

  <!-- Registered User Trunk ==> Process 2.2 -->
  <line x1="180" y1="286" x2="586" y2="286" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-right)" />
  <text x="380" y="279" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Payment Information (GCash / Payment Method, etc.)</text>

  <!-- Process 2.2 ==> Registered User Trunk -->
  <line x1="587" y1="314" x2="182" y2="314" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-left)" />
  <text x="380" y="329" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Payment Status / Receipt</text>

  <!-- Process 2.2 ==> D4 tbl_booking_payments -->
  <line x1="693" y1="286" x2="908" y2="286" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-right)" />
  <text x="800" y="279" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Payment Data</text>

  <!-- D4 tbl_booking_payments ==> Process 2.2 -->
  <line x1="909" y1="314" x2="695" y2="314" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-left)" />
  <text x="800" y="329" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Pricing / Payment Records</text>


  <!-- ================= VERTICAL: 2.2 ===> 2.3 ====================== -->
  <line x1="640" y1="353" x2="640" y2="436" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-down)" />
  <text x="648" y="398" text-anchor="start" font-size="10" font-weight="600" fill="#0f172a">Payment Confirmation</text>


  <!-- =================== ROW 3: PROCESS 2.3 ======================== -->
  <!-- Administrator ==> Process 2.3 -->
  <line x1="265" y1="476" x2="586" y2="476" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-right)" />
  <text x="420" y="469" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Approve / Update Booking (Status, Notes, etc.)</text>

  <!-- Process 2.3 ==> Administrator -->
  <line x1="587" y1="504" x2="267" y2="504" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-left)" />
  <text x="420" y="519" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Booking Status / Confirmation (Updated Details)</text>

  <!-- Process 2.3 ==> D2 tbl_bookings -->
  <line x1="693" y1="476" x2="908" y2="476" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-right)" />
  <text x="800" y="469" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Update Booking Data</text>

  <!-- D2 tbl_bookings ==> Process 2.3 -->
  <line x1="909" y1="504" x2="695" y2="504" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-left)" />
  <text x="800" y="519" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Updated Booking Records</text>


  <!-- ================= BOTTOM NOTIFICATION LOOP ==================== -->
  <!-- Process 2.3 ==> Administrator (Booking Status / Notification) -->
  <path d="M 636 542 L 636 585 L 140 585 L 140 520" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-up)" />
  <text x="360" y="579" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Booking Status / Notification</text>


  <!-- ================= VERTICAL: ADMIN ===> USER ==================== -->
  <!-- Administrator ==> Registered User direct vertical sync -->
  <line x1="120" y1="462" x2="120" y2="138" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow-up)" />

</svg>